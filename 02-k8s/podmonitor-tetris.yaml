apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    release: kube-prometheus-stack
  name: tetris-game
  namespace: tetris-test
spec:
  namespaceSelector:
    matchNames:
    - tetris-test
  podMetricsEndpoints:
  - interval: 15s
    path: /metrics
    port: http
    relabelings:
    - action: replace
      sourceLabels:
      - __meta_kubernetes_pod_label_rollouts_pod_template_hash
      targetLabel: rollouts_pod_template_hash
    - action: replace
      sourceLabels:
      - __meta_kubernetes_pod_name
      targetLabel: pod
  selector:
    matchLabels:
      app: tetris-game
