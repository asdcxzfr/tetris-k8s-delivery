apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tetris-ingress
  namespace: tetris-test
spec:
  ingressClassName: nginx
  rules:
  - host: tetris.local
    http:
      paths:
      - backend:
          service:
            name: tetris-game-stable
            port:
              number: 8080
        path: /
        pathType: Prefix
