apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: tetris-canary-analysis
  namespace: tetris-test
spec:
  args:
  - name: canary-hash
  metrics:
  - failureCondition: status.failed > 0
    initialDelay: 60s
    name: gameplay-smoke
    provider:
      job:
        spec:
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: tetris-canary-smoke
            spec:
              containers:
              - args:
                - 'pip install --quiet --no-index --find-links=/wheels websocket-client >/dev/null 2>&1 || true

                  python -c "import websocket" 2>/dev/null || python -c "import zipfile,sysconfig,glob; zipfile.ZipFile(glob.glob(''/wheels/websocket_client-*.whl'')[0]).extractall(sysconfig.get_paths()[''purelib''])"

                  python /scripts/smoke.py

                  '
                command:
                - sh
                - -c
                env:
                - name: URLS
                  value: http://tetris-game-canary.tetris-test:8080
                - name: 'N'
                  value: '10'
                - name: WAIT
                  value: '8'
                - name: REQUIRE_OK
                  value: '10'
                image: harbor.local/tetris-game/tetris-game:test-branch-31
                name: smoke
                volumeMounts:
                - mountPath: /scripts
                  name: smoke
                - mountPath: /wheels
                  name: wheels
              imagePullSecrets:
              - name: harbor-pull-secret
              nodeSelector:
                kubernetes.io/hostname: harbor
              restartPolicy: Never
              volumes:
              - configMap:
                  name: canary-smoke-probe
                name: smoke
              - hostPath:
                  path: /root/loadtest-wheels
                  type: Directory
                name: wheels
    successCondition: status.succeeded > 0
  - consecutiveErrorLimit: 10
    failureCondition: result[0] < 1
    failureLimit: 1
    initialDelay: 120s
    interval: 30s
    name: app-up
    provider:
      prometheus:
        address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: "sum(up{namespace=\"tetris-test\",\n    rollouts_pod_template_hash=\"{{args.canary-hash}}\"})\n"
  - consecutiveErrorLimit: 10
    failureCondition: result[0] >= 0.05
    failureLimit: 0
    initialDelay: 60s
    interval: 1m
    name: business-error-rate
    provider:
      prometheus:
        address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: "sum(rate(tetris_errors_total{namespace=\"tetris-test\",\n    rollouts_pod_template_hash=\"{{args.canary-hash}}\"}[2m])) or vector(0)\n"
  - consecutiveErrorLimit: 10
    failureCondition: result[0] >= 0.2
    failureLimit: 0
    initialDelay: 60s
    interval: 1m
    name: game-start-failure-ratio
    provider:
      prometheus:
        address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: "sum(rate(tetris_game_start_failed_total{namespace=\"tetris-test\",\n    rollouts_pod_template_hash=\"{{args.canary-hash}}\"}[5m]))\n/\nclamp_min(sum(rate(tetris_game_start_total{namespace=\"\
          tetris-test\",\n    rollouts_pod_template_hash=\"{{args.canary-hash}}\"}[5m])), 0.001)\nor vector(0)\n"
  - consecutiveErrorLimit: 10
    failureCondition: result[0] >= 0.05
    failureLimit: 0
    initialDelay: 60s
    interval: 1m
    name: http-5xx-rate
    provider:
      prometheus:
        address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: "(sum(rate(flask_http_request_total{namespace=\"tetris-test\",\n     status=~\"5..\", rollouts_pod_template_hash=\"{{args.canary-hash}}\"}[2m]))\n or (0 * sum(rate(flask_http_request_total{namespace=\"\
          tetris-test\",\n     rollouts_pod_template_hash=\"{{args.canary-hash}}\"}[2m]))))\n/\nclamp_min(sum(rate(flask_http_request_total{namespace=\"tetris-test\",\n     rollouts_pod_template_hash=\"\
          {{args.canary-hash}}\"}[2m])), 0.001)\nor vector(0)\n"
  - consecutiveErrorLimit: 10
    failureCondition: result[0] > 0.5
    failureLimit: 1
    initialDelay: 60s
    interval: 1m
    name: p95-latency
    provider:
      prometheus:
        address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: "histogram_quantile(0.95,\n  sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"tetris-test\",\n      rollouts_pod_template_hash=\"{{args.canary-hash}}\"}[2m])) by (le))\nor\
          \ vector(0)\n"
  - consecutiveErrorLimit: 10
    failureCondition: result[0] >= 1
    failureLimit: 1
    initialDelay: 60s
    interval: 1m
    name: exceptions
    provider:
      prometheus:
        address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: "sum(rate(flask_http_request_exceptions_total{namespace=\"tetris-test\",\n    rollouts_pod_template_hash=\"{{args.canary-hash}}\"}[2m])) or vector(0)\n"
